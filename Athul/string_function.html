<!DOCTYPE html>
<html>
<head>
<title>String and Math functions</title>
</head>
<body>
<h2>String Functions</h2>
<script>
var str="Hello JavaScript";
document.write("Original string:"+str+"<br>");
document.write("Length:"+str.length+"<br>");
document.write("Uppercase:"+str.toUpperCase()+"<br>");
document.write("Lowercase:"+str.toLowerCase()+"<br>");
document.write("Charater at position 1:"+str.charAt(1)+"<br>");
document.write("Substring:"+str.substring(0,5)+"<br>");
document.write("<h2> Math functions</h2>");
var num=16.7;
document.write("Numbers:"+num+"<br>");
document.write("Round:"+Math.round(num)+"<br>");
document.write("Ceil:"+Math.ceil(num)+"<br>");
document.write("Floor:"+Math.floor(num)+"<br>");
document.write("Squareroot:"+Math.sqrt(25)+"<br>");
document.write("Power:"+Math.pow(2,3)+"<br>");
document.write("Absolute:"+Math.abs(-10)+"<br>");
document.write("Random number:"+Math.random(num)+"<br>");
</script>
</body>
</html>
