<!DOCTYPE html>
<html>
<head>
<title>Registration form</title>
</head>
<h1>STUDENT REGISTRATION FORM</h1>
<body>

<form>
<lable>Student Name</lable>
<input type="text" name="student name"><br>
<br><lable>Gender</lable>
<input type="radio" name="gender" value="male">Male</input>
<input type="radio" name="gender" value="female">Female</input>
<br>
<br><lable>Course</lable>
<select name="course">
<option value="Select course">Select Course</option>
<option value="Btech CS">Btech CS</option>
<option value="Btech Electronics">Btech Electronics</option>
<option value="Mtech">Mtech</option>
<option value="MCA">MCA</option>
</select><br>
<br><lable>Email</lable>
<input type="text" name="Email"><br>
<br><lable>Password</lable>
<input type="text" name="password"><br>
<br><lable>Confirm Password</lable>
<input type="text" name="Confirm Password"><br>
<br><lable>Address</lable>
<input type="text" name="Address"><br>
<br><lable>Contact</lable>
<input type="text" name="Contact"><br>
<br><button type="Submit">Submit</button>
<button type="Reset">Reset</button>

</body>
</html>
