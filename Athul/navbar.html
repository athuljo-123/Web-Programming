<DOCTYPE html>
<head>
<title> Navbar using CSS</title>
<style>
.sidenav{
  height:100%;
  width:160px;
  padding-top:20px;
  background-color:green;
  position:fixed;
  top:0;
  left:0;
}
.sidenav a{
  display:block;
  text-decoration:none;
  padding-top:6px;
  padding-left:16px;
  padding-right:8px;
  padding-bottom:6px;
  color:white;
}
.sidenav a:hover{
 color:red
}
.main{
  margin-left:160px;
  padding-top:0px;
  padding-left:10px;
  padding-right:10px;
  padding-bottom:0px;
  height:2000px;
}
</style>
</head>
<body>

    <div class="sidenav">
        <a href="#about us">About Us</a>
        <a href="#department">Department</a>
        <a href="#mission">Mission</a>
        <a href="#vision">Vision</a>
        <a href="#contact">Contact</a>
    </div>

    <div class="main">
        <h1>Navigation Bar</h1>

        <h2 id="about">About</h2>
        <p>This is the about section.</p>

       <h2 id="department">Department</h2>
        <p>Courses Available</p>

        <h2 id="mission">Mission</h2>
        <p>To provide high quality education.</p>

        <h2 id="vision">Vision</h2>
        <p>Raise students to higher standards.</p>

        <h2 id="contact">Contact</h2>
        <p>The College of Engineering Chengannur Phone:9876543210</p>
    </div>

</body>
</html>
