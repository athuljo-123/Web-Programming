<DOCTYPE HTML>
<html>
<head>
<title>Striped table using CSS</title>
<style>
#table{
  width:80%;
  font-family:arial,sans-serif;
  border-collapse:collapse;
  margin:20px;
}
#table th,#table td,#table tr{
  border:1px solid;
}
#table th.{
   color:white;
   background-color:#04AA6D;
   text-align:left;
   padding:15px;
   border:1px solid red;
}
#table td{
   padding:12px;
}
#table tr:nth-child(even){
  background-color:#f2f2f2;
}
#table tr:hover{
   background-color:#ddd;
}
</style>
</head>
<body>
<h2 style="text-align:center">Striped Table</h2>
<table id="table">
<tr>
<th>Roll no.</th>
<th>Name</th>
<th>Course</th>
<th>Mark</th>
</tr>
<tr>
<td>1</td>
<td>Arjun</td>
<td>MCA</td>
<td>50</td>
</tr>
<tr>
<td>2</td>
<td>Jhon</td>
<td>MCA</td>
<td>80</td>
</tr>
<tr>
<td>3</td>
<td>Neha</td>
<td>MCA</td>
<td>75</td>
</tr>
<tr>
<td>4</td>
<td>Arun</td>
<td>MCA</td>
<td>60</td>
</tr>
</table>
</body>
</html>
